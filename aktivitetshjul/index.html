<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivitets-Lykkehjul</title>
    <!-- Tailwind CSS til layout og styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        /* Container til at holde hjulet pænt centreret med skygge */
        .wheel-wrapper {
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border-radius: 9999px;
            padding: 12px;
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
        }

        /* Animation af pilen i toppen */
        @keyframes tick {
            0% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-50%) rotate(-12deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }

        .pointer-tick {
            animation: tick 0.15s ease-in-out;
        }

        /* Modal baggrunds-blur */
        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8 max-w-5xl mx-auto">

    <header class="text-center my-4">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-slate-800">Aktivitetshjulet</h1>
        <p class="text-slate-500 mt-2 text-sm md:text-base">Mangler du inspiration? Spind hjulet og få en idé til din næste opgave!</p>
    </header>

    <main class="flex flex-col items-center justify-center my-auto w-full py-4">
        
        <!-- Hovedcontainer for lykkehjulet -->
        <div class="relative flex items-center justify-center w-full max-w-[600px]">
            
            <!-- Pil i toppen af hjulet -->
            <div id="wheel-pointer" class="absolute -top-4 left-1/2 -translate-x-1/2 z-20 w-10 h-12 flex justify-center items-start transition-transform origin-top">
                <svg width="40" height="48" viewBox="0 0 32 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-md">
                    <path d="M16 40L2 10C0 6 3 0 8 0H24C29 0 32 6 30 10L16 40Z" fill="#1e293b"/>
                    <circle cx="16" cy="10" r="4" fill="#ffffff" />
                </svg>
            </div>

            <!-- Canvas Hjul -->
            <div class="wheel-wrapper flex items-center justify-center">
                <canvas id="wheel-canvas" class="w-full h-full rounded-full"></canvas>
            </div>

            <!-- Spin-knap i midten -->
            <button id="center-spin-btn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-20 h-20 md:w-28 md:h-28 rounded-full bg-slate-900 text-white font-black text-xl md:text-2xl shadow-2xl hover:bg-slate-800 hover:scale-105 active:scale-95 transition-all flex items-center justify-center border-4 border-white">
                SPIN
            </button>
        </div>

        <!-- Stor mobilvenlig spin-knap under hjulet -->
        <button id="main-spin-btn" class="mt-8 px-10 py-4 bg-slate-900 hover:bg-slate-800 text-white font-bold text-lg rounded-2xl shadow-xl hover:shadow-slate-300 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Spind Hjulet
        </button>

    </main>

    <!-- Modal til visning af resultat -->
    <div id="result-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center transform scale-95 transition-transform duration-300" id="modal-card">
            <div class="w-16 h-16 bg-slate-100 text-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                ✨
            </div>
            <h3 class="text-xs font-bold tracking-wider text-slate-500 uppercase mb-1">Hjulet har talt!</h3>
            <h2 id="modal-result-text" class="text-2xl font-extrabold text-slate-800 my-3 leading-snug">
                <!-- Resultat-tekst indsættes her -->
            </h2>
            <p id="modal-encouragement" class="text-sm text-slate-500 mb-6 italic">
                <!-- Opmuntring tekst indsættes her -->
            </p>
            <button id="close-modal-btn" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl shadow-md transition-all">
                Modtaget!
            </button>
        </div>
    </div>

    <footer class="text-center text-xs text-slate-400 my-4">
        Aktivitetshjul • Lavet til at give inspiration i hverdagen
    </footer>

    <script>
        // Rediger eller tilføj dine aktiviteter direkte herunder:
        const ACTIVITIES = [
            "Tag opvasken", "Gør toilettet rent", "Gør badet rent", "Gå ned med skraldet",
            "Gå ned med sorteringsskrald", "Støvsug lejligheden", "Gør køleskab rent",
            "Smid gammel mad ud", "Red seng", "Skift sengetøj", "Ryst gulvtæpper",
            "Afrim fryser", "Afkalk elkeddel", "Luft ud", "Støv overflader af",
            "Gør fodlister rent", "Rengør hoveddør", "Rengør bestikskuffe",
            "Afkalk brusehoved", "Fjern hår fra badet", "Stræk ud", "Lav squats",
            "Lav armbøjninger", "Dans til en sang", "Farvelæg en side i en malebog",
            "Find på en vibe-code idé", "Vand planter", "Skriv alle dine tanker ned i 5 min", "Ryd op i dit klædeskab", "Find på et SketchUp møbel"
        ];

        // Dine 5 valgte farver
        const COLORS = [
            "#F4B2BB",
            "#E7898A",
            "#F3B46D",
            "#FFE0A9",
            "#FBDBE4"
        ];

        const ENCOURAGEMENTS = [
            "Du klarer det hurtigt og nemt!",
            "Lidt ad gangen gør en kæmpe forskel.",
            "Sæt noget god musik på imens!",
            "Det bliver så dejligt, når det er gjort.",
            "Giv dig selv et klap på skulderen bagefter!"
        ];

        let currentRotation = 0;
        let isSpinning = false;

        // DOM elementer
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const centerSpinBtn = document.getElementById('center-spin-btn');
        const mainSpinBtn = document.getElementById('main-spin-btn');
        const pointer = document.getElementById('wheel-pointer');

        // Modal DOM
        const resultModal = document.getElementById('result-modal');
        const modalCard = document.getElementById('modal-card');
        const modalResultText = document.getElementById('modal-result-text');
        const modalEncouragement = document.getElementById('modal-encouragement');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Web Audio API til effekter
        let audioCtx = null;

        function playTickSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const notes = [392, 523.25, 659.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.08 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            } catch(e) {}
        }

        // Juster Canvas til High-DPI / Retina skærme for helt skarp tekst
        function setupCanvasForHDPI() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;

            ctx.resetTransform();
            ctx.scale(dpr, dpr);
        }

        function drawWheel() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 4;

            ctx.clearRect(0, 0, width, height);

            const numSlices = ACTIVITIES.length;
            if (numSlices === 0) return;

            const sliceAngle = (2 * Math.PI) / numSlices;

            // Tegn felter (slices)
            for (let i = 0; i < numSlices; i++) {
                const startAngle = currentRotation + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();

                // Hvid adskillelseslinje
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Tegn Tekst
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);

                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#1e293b';

                // Mindre skriftstørrelse (spænder nu mellem 8px og 11px)
                let fontSize = Math.min(11, Math.max(8, Math.floor((radius * 0.5) / numSlices * 2)));
                ctx.font = `600 ${fontSize}px system-ui, -apple-system, sans-serif`;

                let text = ACTIVITIES[i];
                const maxTextWidth = radius - 65;

                if (ctx.measureText(text).width > maxTextWidth) {
                    while (ctx.measureText(text + '...').width > maxTextWidth && text.length > 0) {
                        text = text.slice(0, -1);
                    }
                    text += '...';
                }

                ctx.fillText(text, radius - 20, 0);
                ctx.restore();
            }

            // Midter-cirkel dekoration
            ctx.beginPath();
            ctx.arc(centerX, centerY, 55, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        let spinVelocity = 0;
        let lastSliceIndex = -1;

        function animateSpin() {
            if (!isSpinning) return;

            currentRotation += spinVelocity;
            spinVelocity *= 0.985; // Blød friktion

            const numSlices = ACTIVITIES.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            
            // Pilen peger opad (-PI/2)
            let normalizedAngle = (Math.PI * 1.5 - (currentRotation % (2 * Math.PI))) % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

            const currentSliceIndex = Math.floor(normalizedAngle / sliceAngle);

            if (currentSliceIndex !== lastSliceIndex) {
                playTickSound();
                triggerPointerTick();
                lastSliceIndex = currentSliceIndex;
            }

            drawWheel();

            if (spinVelocity < 0.002) {
                isSpinning = false;
                spinVelocity = 0;
                drawWheel();
                onSpinComplete(currentSliceIndex);
            } else {
                requestAnimationFrame(animateSpin);
            }
        }

        function triggerPointerTick() {
            pointer.classList.remove('pointer-tick');
            void pointer.offsetWidth;
            pointer.classList.add('pointer-tick');
        }

        function spin() {
            if (isSpinning || ACTIVITIES.length === 0) return;

            isSpinning = true;
            spinVelocity = Math.random() * 0.2 + 0.25;
            lastSliceIndex = -1;
            requestAnimationFrame(animateSpin);
        }

        function onSpinComplete(winnerIndex) {
            playWinSound();
            const selectedActivity = ACTIVITIES[winnerIndex];
            const randomEncouragement = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];

            modalResultText.textContent = selectedActivity;
            modalEncouragement.textContent = `"${randomEncouragement}"`;

            resultModal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
            resultModal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Event listeners
        centerSpinBtn.addEventListener('click', spin);
        mainSpinBtn.addEventListener('click', spin);
        closeModalBtn.addEventListener('click', closeModal);
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) closeModal();
        });

        function resizeAndRedraw() {
            setupCanvasForHDPI();
            drawWheel();
        }

        window.addEventListener('resize', resizeAndRedraw);
        
        window.onload = function() {
            resizeAndRedraw();
        };
    </script>
</body>
</html>
